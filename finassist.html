<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FinAssist AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --green-900: #04342C;
      --green-800: #085041;
      --green-600: #0F6E56;
      --green-400: #1D9E75;
      --green-200: #5DCAA5;
      --green-100: #9FE1CB;
      --green-50: #E1F5EE;
      --gray-900: #2C2C2A;
      --gray-800: #444441;
      --gray-600: #5F5E5A;
      --gray-400: #888780;
      --gray-200: #B4B2A9;
      --gray-100: #D3D1C7;
      --gray-50: #F1EFE8;
      --amber-400: #BA7517;
      --amber-100: #FAC775;
      --amber-50: #FAEEDA;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background: var(--gray-900);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .phone-frame {
      width: 390px;
      height: 844px;
      background: var(--gray-800);
      border-radius: 44px;
      padding: 12px;
      box-shadow: 0 40px 80px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(255,255,255,0.08);
      position: relative;
      flex-shrink: 0;
    }

    .phone-inner {
      width: 100%;
      height: 100%;
      background: #0a0f0d;
      border-radius: 34px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* status bar */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 24px 6px;
      flex-shrink: 0;
    }

    .status-time {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      font-weight: 500;
      color: rgba(255,255,255,0.9);
    }

    .status-icons {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .status-icons span {
      font-size: 12px;
      color: rgba(255,255,255,0.7);
    }

    /* header */
    .chat-header {
      padding: 8px 20px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 36px;
      height: 36px;
      background: var(--green-400);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
      color: var(--green-900);
      font-family: 'IBM Plex Mono', monospace;
    }

    .header-info .name {
      font-size: 14px;
      font-weight: 600;
      color: rgba(255,255,255,0.95);
      letter-spacing: 0.02em;
    }

    .header-info .status {
      font-size: 11px;
      color: var(--green-200);
      font-family: 'IBM Plex Mono', monospace;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      background: var(--green-200);
      border-radius: 50%;
      animation: pulse-anim 2s ease-in-out infinite;
    }

    @keyframes pulse-anim {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }

    .header-btn {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: rgba(255,255,255,0.06);
      border: none;
      color: rgba(255,255,255,0.5);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transition: background 0.15s;
    }
    .header-btn:hover { background: rgba(255,255,255,0.1); }

    /* messages */
    .chat-messages {
      flex: 1;
      padding: 16px 16px 8px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.1) transparent;
    }

    .chat-messages::-webkit-scrollbar { width: 3px; }
    .chat-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

    .date-chip {
      text-align: center;
      font-size: 10px;
      font-family: 'IBM Plex Mono', monospace;
      color: var(--gray-600);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin: 4px 0;
    }

    .message {
      display: flex;
      flex-direction: column;
      max-width: 82%;
      animation: msg-in 0.2s ease-out;
    }

    @keyframes msg-in {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.ai { align-self: flex-start; }
    .message.user { align-self: flex-end; }

    .bubble {
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 13.5px;
      line-height: 1.5;
    }

    .message.ai .bubble {
      background: rgba(255,255,255,0.07);
      color: rgba(255,255,255,0.88);
      border-bottom-left-radius: 4px;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .message.user .bubble {
      background: var(--green-600);
      color: var(--green-50);
      border-bottom-right-radius: 4px;
    }

    .msg-time {
      font-size: 10px;
      font-family: 'IBM Plex Mono', monospace;
      color: var(--gray-600);
      margin-top: 4px;
      padding: 0 4px;
    }

    .message.user .msg-time { text-align: right; }

    /* breakdown cards */
    .breakdown {
      display: flex;
      gap: 6px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .category {
      background: rgba(29, 158, 117, 0.15);
      border: 1px solid rgba(29, 158, 117, 0.25);
      padding: 7px 10px;
      border-radius: 10px;
      min-width: 80px;
    }

    .category-title {
      font-size: 9px;
      font-family: 'IBM Plex Mono', monospace;
      color: var(--green-200);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .category-amount {
      font-weight: 600;
      color: var(--amber-100);
      font-size: 15px;
      font-family: 'IBM Plex Mono', monospace;
    }

    /* typing indicator */
    .typing-bubble {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 12px 16px;
    }

    .typing-bubble span {
      width: 6px;
      height: 6px;
      background: var(--gray-400);
      border-radius: 50%;
      animation: bounce 1.2s ease-in-out infinite;
    }

    .typing-bubble span:nth-child(2) { animation-delay: 0.2s; }
    .typing-bubble span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
      30% { transform: translateY(-5px); opacity: 1; }
    }

    /* input */
    .chat-input-area {
      padding: 10px 16px 6px;
      border-top: 1px solid rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .input-wrap {
      flex: 1;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      display: flex;
      align-items: center;
      padding: 0 14px;
      transition: border-color 0.15s;
    }

    .input-wrap:focus-within {
      border-color: var(--green-400);
    }

    .input-wrap input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13.5px;
      color: rgba(255,255,255,0.9);
      padding: 10px 0;
    }

    .input-wrap input::placeholder { color: var(--gray-600); }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      transition: transform 0.1s, background 0.15s;
      flex-shrink: 0;
    }

    .icon-btn:active { transform: scale(0.92); }

    #mic-btn {
      background: rgba(255,255,255,0.07);
      color: rgba(255,255,255,0.6);
    }

    #mic-btn:hover { background: rgba(255,255,255,0.12); }
    #mic-btn.listening { background: #c0392b; color: white; }

    #send-btn {
      background: var(--green-400);
      color: var(--green-900);
    }

    #send-btn:hover { background: var(--green-200); }

    /* nav */
    .chat-footer {
      display: flex;
      justify-content: space-around;
      padding: 8px 0 16px;
      border-top: 1px solid rgba(255,255,255,0.06);
      flex-shrink: 0;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      padding: 4px 12px;
      border-radius: 10px;
      transition: background 0.15s;
    }

    .nav-item:hover { background: rgba(255,255,255,0.05); }
    .nav-item.active .nav-icon { color: var(--green-200); }
    .nav-item.active .nav-label { color: var(--green-200); }

    .nav-icon { font-size: 16px; color: var(--gray-600); }
    .nav-label { font-size: 9px; font-family: 'IBM Plex Mono', monospace; color: var(--gray-600); letter-spacing: 0.08em; text-transform: uppercase; }

    /* image upload */
    #img-input { display: none; }

    #attach-btn {
      background: rgba(255,255,255,0.07);
      color: rgba(255,255,255,0.6);
    }
    #attach-btn:hover { background: rgba(255,255,255,0.12); }
    #attach-btn.has-image { background: rgba(29,158,117,0.25); color: var(--green-200); }

    .image-preview-bar {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 8px 16px 0;
      flex-shrink: 0;
    }

    .image-preview-bar.visible { display: flex; }

    .preview-thumb {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      object-fit: cover;
      border: 1px solid rgba(29,158,117,0.4);
    }

    .preview-label {
      flex: 1;
      font-size: 11px;
      font-family: 'IBM Plex Mono', monospace;
      color: var(--green-200);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .preview-remove {
      background: rgba(255,255,255,0.07);
      border: none;
      color: rgba(255,255,255,0.5);
      font-size: 14px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .preview-remove:hover { background: rgba(192,57,43,0.3); color: #e74c3c; }

    /* image bubble */
    .msg-image {
      max-width: 100%;
      border-radius: 12px;
      display: block;
      margin-bottom: 6px;
      border: 1px solid rgba(255,255,255,0.08);
    }

    /* error banner */
    .error-banner {
      background: rgba(192, 57, 43, 0.15);
      border: 1px solid rgba(192, 57, 43, 0.3);
      color: #e74c3c;
      font-size: 12px;
      font-family: 'IBM Plex Mono', monospace;
      padding: 8px 14px;
      border-radius: 10px;
      margin: 4px 0;
      align-self: center;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="phone-frame">
  <div class="phone-inner">

    <div class="status-bar">
      <span class="status-time" id="clock">9:41</span>
      <div class="status-icons">
        <span>▲▲▲</span>
        <span>WiFi</span>
        <span>100%</span>
      </div>
    </div>

    <div class="chat-header">
      <div class="header-left">
        <div class="avatar">FA</div>
        <div class="header-info">
          <div class="name">FinAssist AI</div>
          <div class="status">
            <div class="pulse-dot"></div>
            active
          </div>
        </div>
      </div>
      <button class="header-btn">⋯</button>
    </div>

    <div id="chat-messages" class="chat-messages">
      <!-- seeded by JS -->
    </div>

    <div class="image-preview-bar" id="preview-bar">
      <img class="preview-thumb" id="preview-thumb" src="" alt="preview" />
      <span class="preview-label" id="preview-label"></span>
      <button class="preview-remove" id="preview-remove">✕</button>
    </div>

    <div class="chat-input-area">
      <input type="file" id="img-input" accept="image/*" />
      <div class="input-wrap">
        <input type="text" id="user-input" placeholder="Ask about your finances…" autocomplete="off" />
      </div>
      <button class="icon-btn" id="attach-btn" title="Attach image">📎</button>
      <button class="icon-btn" id="mic-btn">🎤</button>
      <button class="icon-btn" id="send-btn">➤</button>
    </div>

    <div class="chat-footer">
      <div class="nav-item active">
        <div class="nav-icon">💬</div>
        <div class="nav-label">Chat</div>
      </div>
      <div class="nav-item">
        <div class="nav-icon">📊</div>
        <div class="nav-label">Activity</div>
      </div>
      <div class="nav-item">
        <div class="nav-icon">⚙️</div>
        <div class="nav-label">Settings</div>
      </div>
    </div>

  </div>
</div>

<script>
// ── DOM ──────────────────────────────────────────────────────────────
const el = {
  messages: document.getElementById('chat-messages'),
  input: document.getElementById('user-input'),
  send: document.getElementById('send-btn'),
  mic: document.getElementById('mic-btn'),
  clock: document.getElementById('clock'),
  attach: document.getElementById('attach-btn'),
  imgInput: document.getElementById('img-input'),
  previewBar: document.getElementById('preview-bar'),
  previewThumb: document.getElementById('preview-thumb'),
  previewLabel: document.getElementById('preview-label'),
  previewRemove: document.getElementById('preview-remove')
};

// ── Image state ───────────────────────────────────────────────────────
let pendingImage = null; // { base64, mimeType, name }

el.attach.onclick = () => el.imgInput.click();

el.imgInput.onchange = (e) => {
  const file = e.target.files?.[0];
  if (!file) return;
  if (!file.type.startsWith('image/')) { addError('Please select an image file.'); return; }
  if (file.size > 5 * 1024 * 1024) { addError('Image must be under 5 MB.'); return; }

  const reader = new FileReader();
  reader.onload = (ev) => {
    const dataUrl = ev.target.result;
    const base64 = dataUrl.split(',')[1];
    pendingImage = { base64, mimeType: file.type, name: file.name };

    el.previewThumb.src = dataUrl;
    el.previewLabel.textContent = file.name;
    el.previewBar.classList.add('visible');
    el.attach.classList.add('has-image');
  };
  reader.readAsDataURL(file);
  e.target.value = ''; // reset so same file can be re-selected
};

el.previewRemove.onclick = clearImage;

function clearImage() {
  pendingImage = null;
  el.previewBar.classList.remove('visible');
  el.previewThumb.src = '';
  el.previewLabel.textContent = '';
  el.attach.classList.remove('has-image');
}

// ── Clock ─────────────────────────────────────────────────────────────
function updateClock() {
  const now = new Date();
  const h = now.getHours() % 12 || 12;
  const m = String(now.getMinutes()).padStart(2, '0');
  el.clock.textContent = `${h}:${m}`;
}
updateClock();
setInterval(updateClock, 30000);

// ── Speech ────────────────────────────────────────────────────────────
let recognition = null, isListening = false;

(function initSpeech() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { el.mic.disabled = true; el.mic.title = "Not supported"; return; }

  recognition = new SR();
  recognition.lang = 'en-US';
  recognition.interimResults = false;
  recognition.continuous = false;

  recognition.onstart = () => { isListening = true; el.mic.classList.add('listening'); };
  recognition.onend   = () => { isListening = false; el.mic.classList.remove('listening'); };
  recognition.onerror = (e) => console.error('Speech error:', e.error);
  recognition.onresult = (e) => {
    const t = e.results?.[0]?.[0]?.transcript || '';
    if (!t) return;
    el.input.value = t;
    queueMicrotask(sendMessage);
  };
})();

el.mic.onclick = () => {
  if (!recognition) return;
  if (isListening) { recognition.stop(); }
  else { try { recognition.start(); } catch {} }
};

// ── Send ──────────────────────────────────────────────────────────────
el.send.onclick = sendMessage;
el.input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); sendMessage(); }
});

const API_URL = 'https://finaassist-ai-606038878824.us-central1.run.app/agent/query';
const TIMEOUT_MS = 12000;

async function sendMessage() {
  const text = el.input.value.trim();
  const image = pendingImage;
  if (!text && !image) return;

  el.input.value = '';
  clearImage();

  addMessage({ sender: 'user', text: text || null, image });

  const loadingEl = addTyping();

  try {
    const body = { user_id: 'usr_12345', message: text || '' };
    if (image) {
      body.image = { data: image.base64, mime_type: image.mimeType };
    }

    const data = await fetchWithTimeout(
      API_URL,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      },
      TIMEOUT_MS
    );

    removeEl(loadingEl);

    const msg = data?.data?.message ?? 'Unexpected response.';
    const breakdown = data?.data?.result?.breakdown ?? null;
    addMessage({ sender: 'ai', text: msg, breakdown });

  } catch (err) {
    console.error(err);
    removeEl(loadingEl);
    const isTimeout = err.name === 'AbortError';
    const errorText = isTimeout
      ? 'Request timed out. The server may be waking up — try again in a moment.'
      : 'Connection issue. Please check your network or try again.';
    addError(errorText);
  }
}

// ── Fetch with timeout ────────────────────────────────────────────────
async function fetchWithTimeout(url, options, timeout) {
  const controller = new AbortController();
  const id = setTimeout(() => controller.abort(), timeout);

  try {
    const res = await fetch(url, { ...options, signal: controller.signal });
    clearTimeout(id);
    if (!res.ok) throw new Error(`HTTP ${res.status}: ${res.statusText}`);
    return res.json();
  } catch (err) {
    clearTimeout(id);
    throw err;
  }
}

// ── UI Helpers ────────────────────────────────────────────────────────
function addMessage({ sender, text, image, breakdown }) {
  const wrap = document.createElement('div');
  wrap.className = `message ${sender}`;

  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  if (image) {
    const img = document.createElement('img');
    img.className = 'msg-image';
    img.src = `data:${image.mimeType};base64,${image.base64}`;
    img.alt = image.name || 'uploaded image';
    bubble.appendChild(img);
  }

  if (text) {
    const p = document.createElement('div');
    p.textContent = text;
    bubble.appendChild(p);
  }

  wrap.appendChild(bubble);

  if (breakdown && typeof breakdown === 'object') {
    const box = document.createElement('div');
    box.className = 'breakdown';
    for (const [key, val] of Object.entries(breakdown)) {
      box.innerHTML += `
        <div class="category">
          <div class="category-title">${key}</div>
          <div class="category-amount">$${Number(val).toLocaleString()}</div>
        </div>`;
    }
    wrap.appendChild(box);
  }

  const time = document.createElement('div');
  time.className = 'msg-time';
  time.textContent = getTime();
  wrap.appendChild(time);

  el.messages.appendChild(wrap);
  scrollBottom();
  return wrap;
}

function addTyping() {
  const wrap = document.createElement('div');
  wrap.className = 'message ai';
  wrap.innerHTML = `<div class="bubble typing-bubble"><span></span><span></span><span></span></div>`;
  el.messages.appendChild(wrap);
  scrollBottom();
  return wrap;
}

function addError(text) {
  const div = document.createElement('div');
  div.className = 'error-banner';
  div.textContent = text;
  el.messages.appendChild(div);
  scrollBottom();
}

function removeEl(node) { node?.remove(); }
function scrollBottom() { el.messages.scrollTop = el.messages.scrollHeight; }
function getTime() {
  return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

// ── Seed messages ─────────────────────────────────────────────────────
const today = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
const chip = document.createElement('div');
chip.className = 'date-chip';
chip.textContent = today;
el.messages.appendChild(chip);

[
  { sender: 'ai',   text: 'Good morning. Your savings are up 12% this month.' },
  { sender: 'user', text: 'Show my spending breakdown' },
  { sender: 'ai',   text: 'Here is your breakdown for this week:', breakdown: { dining: 184, entertainment: 128, transport: 62 } }
].forEach(addMessage);
</script>
</body>
</html>
